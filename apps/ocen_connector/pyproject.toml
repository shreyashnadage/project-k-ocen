[project]
name = "ocen_connector"
authors = [
    { name = "Project K", email = "dev@projectk.example" }
]
description = "OCEN 4.0 async API adapter — participant directory, loan application/offer state, request log, webhook receivers"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "PyJWT>=2.8.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
