# Local development bench for the OCEN platform.
#
# Brings up MariaDB, Redis (cache + queue), and a Frappe bench container with
# this repo's apps/ mounted in. First run needs a one-time bench init +
# site creation + app installs — see `make bench-init` / the commands below.
#
# Usage:
#   docker compose up -d
#   docker compose exec bench bash
#     $ bench new-site ocen.localhost --admin-password admin --no-mariadb-socket
#     $ bench get-app identity_core /workspace/apps/identity_core
#     $ bench get-app ocen_connector /workspace/apps/ocen_connector
#     $ bench get-app los_engine /workspace/apps/los_engine
#     $ bench get-app ddp_engine /workspace/apps/ddp_engine
#     $ bench get-app portal_gateway /workspace/apps/portal_gateway
#     $ bench --site ocen.localhost install-app identity_core ocen_connector los_engine ddp_engine portal_gateway
#     $ bench start

services:
  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  bench:
    image: frappe/bench:latest
    restart: unless-stopped
    entrypoint: /bin/bash
    command: -c "tail -f /dev/null"
    environment:
      - SHELL=/bin/bash
    working_dir: /workspace/frappe-bench
    volumes:
      - bench-data:/workspace
      - ./apps:/workspace/apps
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
    ports:
      - "8000:8000"

volumes:
  mariadb-data:
  redis-queue-data:
  bench-data:
